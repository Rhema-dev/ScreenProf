name: Build macOS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: |
          npm run typecheck
          npm test

      - name: Build universal macOS release
        run: npm run package:mac

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: ScreenProf-${{ github.sha }}-mac-universal
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
